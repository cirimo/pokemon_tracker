org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

kotlin.code.style=official

# Roborazzi records into src/test/screenshots; keep Robolectric's SDK downloads offline-friendly.
robolectric.offline=false

# Unit tests run against debug only.
#
# Robolectric resolves activities from the variant's merged manifest, and
# compose ui-test-manifest (which registers the ComponentActivity the Compose test rule
# launches) is a debug-only dependency. Running the same tests against release therefore
# fails for a reason that has nothing to do with the code. This is also the AGP 9
# default, so setting it here is where we are heading anyway.
android.onlyEnableUnitTestForTheTestedBuildType=true
