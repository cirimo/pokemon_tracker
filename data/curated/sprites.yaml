  # Source: https://bulbapedia.bulbagarden.net/wiki/Minior_(Pok%C3%A9mon) (Forms)
  - reason: All seven shiny Minior cores look the same in current HOME. See overrides.
    variants:
      - minior-red
      - minior-orange
      - minior-yellow
      - minior-green
      - minior-blue
      - minior-indigo
      - minior-violet

  # The authentic forms differ only by a stamp on the underside, which a front-facing
  # render cannot show.
  # Source: https://bulbapedia.bulbagarden.net/wiki/Sinistea_(Pok%C3%A9mon) (Forms)
  - reason: Phony and Antique Sinistea differ only by a stamp under the cup.
    variants: [sinistea, sinistea-antique]
  # Source: https://bulbapedia.bulbagarden.net/wiki/Polteageist_(Pok%C3%A9mon) (Forms)
  - reason: Phony and Antique Polteageist differ only by a stamp under the teapot.
    variants: [polteageist, polteageist-antique]
  # Source: https://bulbapedia.bulbagarden.net/wiki/Poltchageist_(Pok%C3%A9mon) (Forms)
  - reason: Counterfeit and Artisan Poltchageist differ only by a stamp on the caddy base.
    variants: [poltchageist, poltchageist-artisan]
  # Source: https://bulbapedia.bulbagarden.net/wiki/Sinistcha_(Pok%C3%A9mon) (Forms)
  - reason: Unremarkable and Masterpiece Sinistcha differ only by a stamp on the base.
    variants: [sinistcha, sinistcha-masterpiece]

  # The male's only difference is a speck on its rear. PokeAPI's female file is
  # byte-identical to the male's.
  # Source: https://bulbapedia.bulbagarden.net/wiki/Torchic_(Pok%C3%A9mon) (Biology)
  - reason: Male and female Torchic differ only by a speck on the rear.
    variants: [torchic, torchic-f]
