# Sprite exceptions: where the resolution order in
# tools/dataset-pipeline/src/sprite-resolution.ts is not enough, and which variants
# genuinely share art.
#
# Both lists exist because the `sprite-shared` validator refuses any two variants whose
# sprite bytes are identical. That rule caught 364 sprites that were silently the base
# form's art (docs/adr/0005-sprites.md, amended 2026-09-23). Everything below is a claim
# that the rule is wrong for this case, and every claim carries its source.
#
# `file` is relative to PokeAPI's sprites/pokemon/other/home/. A path outside shiny/ is
# normal-colour art; the pipeline accepts one only for a variant whose shiny was never
# released.

overrides:
  # --- no shiny exists, so show the normal colours ------------------------------
  # The cap Pikachu cannot be shiny (upstream shinyReleased: false), and PokeAPI has no
  # shiny render of them. Their slot still needs a picture.
  # Source: https://bulbapedia.bulbagarden.net/wiki/Cap_Pikachu
  - variantId: pikachu-original
    file: 10094.png
  - variantId: pikachu-hoenn
    file: 10095.png
  - variantId: pikachu-sinnoh
    file: 10096.png
  - variantId: pikachu-unova
    file: 10097.png
  - variantId: pikachu-kalos
    file: 10098.png
  - variantId: pikachu-alola
    file: 10099.png
  - variantId: pikachu-world
    file: 10160.png

  # --- upstream points at the wrong PokeAPI entry -------------------------------
  # Upstream's refs for floette-eternal are Red Flower Floette's (pkApiId 670, slug
  # floette-red). PokeAPI's own entry is pokemon 10061.
  # Source: https://pokeapi.co/api/v2/pokemon/10061
  - variantId: floette-eternal
    file: shiny/10061.png

  # Every Minior core shares one shiny appearance in current HOME: a black base with
  # multicoloured flecks. PokeAPI's red core (10136) matches that description. Its other
  # six cores (10137-10142) are one purple render that matches neither -- plausibly from
  # the older HOME versions Bulbapedia says tinted each colour, but that is a guess.
  # Source: https://bulbapedia.bulbagarden.net/wiki/Minior_(Pok%C3%A9mon) (Forms, Trivia)
  - variantId: minior-red
    file: shiny/10136.png
  - variantId: minior-orange
    file: shiny/10136.png
  - variantId: minior-yellow
    file: shiny/10136.png
  - variantId: minior-green
    file: shiny/10136.png
  - variantId: minior-blue
    file: shiny/10136.png
  - variantId: minior-indigo
    file: shiny/10136.png
  - variantId: minior-violet
    file: shiny/10136.png

