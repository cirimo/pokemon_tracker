  # --- Legends Arceus ---------------------------------------------------------
  # Worth knowing: PLA locks the story legendaries but NOT the overworld nobles,
  # which is the kind of asymmetry that makes this file worth having.
  - variantId: arceus
    gameId: la
    reason: Story-locked at the final encounter.
    source: https://www.serebii.net/legendsarceus/shiny.shtml
  # Bulbapedia: "all Legendary, Mythical, and Gift Pokemon are prevented from being Shiny"
  # in Legends Arceus. Gifts are locked per encounter in encounters/la.yaml, because the
  # first partners can also be found in distortions and outbreaks.
