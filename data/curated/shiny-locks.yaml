# Shiny locks: (variant, game) pairs where a shiny is impossible.
#
# This is the single most valuable file in the repo, and the reason a curated layer
# exists at all. PokeAPI does not carry shiny locks. PokePC does not carry shiny locks.
# No machine-readable dataset of them exists -- this was checked, not assumed. Every row
# here is transcribed by hand from Bulbapedia or Serebii, and every row carries the
# source that justifies it so a future me can re-check it.
#
# Facts about a video game are not copyrightable; the wording here is ours. Cite anyway.
#
# SCOPE NOTE: this file is deliberately seeded, not complete. It holds enough rows to
# exercise the schema and the validators. Filling it is M4 work, one game at a time,
# and docs/dataset-pipeline.md explains how.
#
# variantId must be an upstream PokePC id. gameId must appear in games.yaml.
# The validators reject any row that does not resolve, so a typo cannot ship.

locks:
  # --- Scarlet / Violet -------------------------------------------------------
  - variantId: koraidon
    gameId: sv-s
    reason: Story-locked. The box legendary is never shiny in Scarlet.
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon
  - variantId: miraidon
    gameId: sv-v
    reason: Story-locked. The box legendary is never shiny in Violet.
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon

