  # Bulbapedia, Shiny Pokemon, Generation VIII "In-game Shiny Pokemon": the Galarian legendary
  # birds, Keldeo, Calyrex and its steeds can never be shiny, and neither can any in-game gift
  # except a revived fossil. Calyrex, Glastrier, Spectrier, Kubfu, Urshifu, Cosmog and Cosmoem
  # have no shiny released at all, so they need no row (lock-sanity refuses one). Gifts that
  # can also be bred (the first partners, Toxel) are locked on the gift encounter only.
  - variantId: articuno-galar
    gameId: swsh-sw
    reason: Galarian legendary birds are never shiny in Sword and Shield.
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon
