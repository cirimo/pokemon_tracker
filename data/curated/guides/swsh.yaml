  # --- Dynamax Adventure bosses (drafted by draft_swsh.py) ---------------------------
  - id: articuno-max-lair
    title: Articuno in a Dynamax Adventure
    method: dynamax-adventure
    procedure: dynamax-adventure
    variants: [articuno]
    oneInSave: true
    summary: "Articuno (Ice/Flying) is a Max Lair boss: Ice Beam, Freeze-Dry, Hurricane, Mist."
    requires:
      - id: crown-tundra
      - id: shiny-charm
        role: odds
    advice:
      - kind: take
        subject: Aurorus (Ancient Power)
        why: Ancient Power is 4× against Articuno (Ice/Flying); it takes ½× from Articuno's best attack.
        source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure
      - kind: take
        subject: Carkol (Rock Slide)
        why: Rock Slide is 4× against Articuno (Ice/Flying); it takes ½× from Articuno's best attack.
        source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure
      - kind: take
        subject: Drednaw (Rock Slide)
        why: Rock Slide is 4× against Articuno (Ice/Flying); it takes ½× from Articuno's best attack.
        source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure
      - kind: take
        subject: Lairon (Rock Slide)
        why: Rock Slide is 4× against Articuno (Ice/Flying); it takes ½× from Articuno's best attack.
        source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure
      - kind: take
        subject: Relicanth (Head Smash)
        why: Head Smash is 4× against Articuno (Ice/Flying); it takes ½× from Articuno's best attack.
        source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure
      - kind: take
        subject: Klang (Power Gem)
        why: Power Gem is 4× against Articuno (Ice/Flying); it takes ½× from Articuno's best attack.
        source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure
      - kind: avoid
        subject: Grass, Ground, Flying, Dragon types
        why: Ice Beam and Freeze-Dry are Ice, which hits them 2×.
        source: https://bulbapedia.bulbagarden.net/wiki/Type
      - kind: avoid
        subject: Grass, Fighting, Bug types
        why: Hurricane is Flying, which hits them 2×.
        source: https://bulbapedia.bulbagarden.net/wiki/Type
      - kind: avoid
        subject: Rentals that only have Ground attacks
        why: Ground does not affect Articuno (Ice/Flying).
        source: https://bulbapedia.bulbagarden.net/wiki/Type
      - kind: note
        subject: Resisted
        why: Articuno (Ice/Flying) resists Grass, Bug attacks.
        source: https://bulbapedia.bulbagarden.net/wiki/Type

