# Guides for Sword and Shield: how to hunt each shiny step by step, what to build first and
# how to farm it. Built into the guide tables of reference.db (docs/dataset-pipeline.md, "The
# guide layer").
#
# Curated 2026-11-18 for Sword (prompt 11). Every step, build part, piece of advice and farm
# link cites the page it was read from; the wording is ours. The per-boss Dynamax Adventure
# guides under `guides:` were drafted by tools/curation/draft_swsh.py (rental advice from the
# boss's moves and the rental pool on Bulbapedia's Dynamax Adventure page, against the type
# chart) and read through by hand. Builds are checked against PokeAPI's sword-shield
# learnsets: run `python tools/curation/learnsets.py` after changing one.
#
# Not here, on purpose: a guide for Regigigas (whether a den's shiny can be reset is not
# settled by any source read, and its five-giant requirement contradicts the one-of-two rule
# for Regieleki and Regidrago), and the Swords of Justice (they are already caught).

