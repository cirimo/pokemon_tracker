requirements:
  - id: crown-tundra
    label: The Crown Tundra
    kind: dlc
    detail: The second part of the Expansion Pass. Dynamax Adventures and the legendary giants are in it.
    source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure
  - id: shiny-charm
    label: Shiny Charm
    kind: item
    optional: true
    detail: >-
      Two extra shiny rolls for wild, static and fishing encounters, and 1/100 instead of 1/300
      in a Dynamax Adventure. No effect on the legendary giants, fossils, curry, dens or
      scripted encounters.
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Charm
    farm:
      - kind: reward
        location: circhester
        detail: From the Game Freak game director, once every Pokemon in the mainland Galar Pokedex is caught.
        source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Charm
  - id: legendary-clue-2
    label: Legendary Clue 2
    kind: story
    detail: Peony's second clue points to the four temples of the legendary giants.
    source: https://bulbapedia.bulbagarden.net/wiki/List_of_in-game_event_Pok%C3%A9mon_in_Pok%C3%A9mon_Sword_and_Shield
  - id: legendary-clue-q
    label: Legendary Clue?
    kind: story
    detail: >-
      Left on the Freeze Inn doormat in Freezington once every Legendary Clue is done. Ultra
      Beasts and Necrozma appear in Dynamax Adventures only after it is read.
    source: https://bulbapedia.bulbagarden.net/wiki/Legendary_Clue%3F
  - id: nso
    label: Online play
    kind: service
    detail: >-
      A Shield-exclusive legendary is not in Sword's Max Lair. Joining a Dynamax Adventure
      hosted on Shield, online, meets it, and its path then stays unlocked.
    source: https://bulbapedia.bulbagarden.net/wiki/Version-exclusive_Pok%C3%A9mon
    farm:
      - kind: shop
        detail: A Nintendo Switch Online membership, then Link Code play from the Max Lair.
        source: https://bulbapedia.bulbagarden.net/wiki/Version-exclusive_Pok%C3%A9mon

builds:
  - id: false-swipe-catcher
    variant: gallade
    title: False Swipe catcher
    purpose: >-
      Brings a reset legendary to 1 HP without knocking it out, then puts it to sleep, so the
      shiny is caught in the few balls it takes rather than lost to a faint.
    parts:
      - kind: move
        value: False Swipe
        why: It always leaves the target with at least 1 HP, so a shiny cannot faint by accident.
        source: https://bulbapedia.bulbagarden.net/wiki/False_Swipe_(move)
      - kind: move
        value: Hypnosis
        why: Sleep multiplies the catch chance by more than any other status.
        source: https://bulbapedia.bulbagarden.net/wiki/Catch_rate
      - kind: move
        value: Thunder Wave
        why: Paralysis is the fallback when Hypnosis misses, and also raises the catch chance.
        source: https://bulbapedia.bulbagarden.net/wiki/Catch_rate
    farm:
      - kind: catch
        detail: >-
          Catch a male Ralts in the Wild Area (Dappled Grove, the Lake Miloch shores, Rolling
          Fields, Watchtower Ruins, West Lake Axewell), or in the Fields of Honor on the Isle of
          Armor.
        source: https://bulbapedia.bulbagarden.net/wiki/Ralts_(Pok%C3%A9mon)
      - kind: catch
        detail: Ralts evolves into Kirlia at level 20; a male Kirlia becomes Gallade with a Dawn Stone.
        source: https://bulbapedia.bulbagarden.net/wiki/Ralts_(Pok%C3%A9mon)
      - kind: catch
        location: giants-cap
        detail: >-
          A Dawn Stone lies in Giant's Cap; it is also a hidden recurring item at the Lake of
          Outrage and a Digging Duo find in Bridge Field.
        source: https://bulbapedia.bulbagarden.net/wiki/Dawn_Stone
      - kind: tutor
        detail: Gallade knows Hypnosis from level 1 and learns False Swipe at level 23; the Move Reminder teaches either.
        source: https://bulbapedia.bulbagarden.net/wiki/Gallade_(Pok%C3%A9mon)/Generation_VIII_learnset
      - kind: tm
        location: motostoke
        detail: TM94 False Swipe, if it was skipped, from the upper Pokemon Center in Motostoke for 10,000.
        source: https://bulbapedia.bulbagarden.net/wiki/TM094
      - kind: tm
        detail: TM14 Thunder Wave.
        source: https://bulbapedia.bulbagarden.net/wiki/Gallade_(Pok%C3%A9mon)/Generation_VIII_learnset

procedures:
  - id: dynamax-adventure
    title: Dynamax Adventure
    steps:
      - section: prepare
        text: Dynamax Adventures start at the Max Lair on Slippery Slope. You cannot bring your own Pokemon; everyone picks a rental.
        location: max-lair
        source: https://bulbapedia.bulbagarden.net/wiki/Max_Lair
      - section: prepare
        text: Get the Shiny Charm first if you can. Every Pokemon in an adventure is then 1/100 instead of 1/300.
        source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure
      - section: setup
        text: >-
          Reach the boss once. Peonia sometimes offers the path to a legendary for 5 Dynite
          Ore; her offer always matches what "Anything is fine" would lead to, so you can also
          try that path for free.
        source: https://bulbapedia.bulbagarden.net/wiki/Max_Lair
      - section: setup
        text: >-
          When you reach a boss and do not keep it, the scientist offers to note its path. Up
          to three paths can be noted at once; a fourth needs one of them deleted.
        source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure
      - section: loop
        text: Choose the noted path. The game saves before every adventure.
        source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure
      - section: loop
        text: Pick one of three rentals. Any Pokemon you defeat on the way can replace yours, so swap up when the next one fights the boss better.
        source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure
      - section: loop
        text: Win three Max Raid Battles, then the boss. Everything you defeat is caught without fail.
        source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure
      - section: check
        text: >-
          Nothing looks shiny during the adventure. Shininess is decided on the final screen
          where you choose one Pokemon to keep, so another player may see a different result.
          Shinies from adventures always have star sparkles.
        source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure
      - section: after
        text: >-
          If the boss is shiny, keep it. If it is not but one of the other three is, keep that
          one instead: the boss stays catchable and its path can be noted again.
        source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure
      - section: mistake
        text: >-
          Keeping a boss that is not shiny ends it for this save. A kept special Pokemon can
          never be caught again, even after it is traded away or released.
        source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure
      - section: mistake
        text: Failing before the boss notes no path, even on a path Peonia sold you.
        source: https://bulbapedia.bulbagarden.net/wiki/Max_Lair

  - id: soft-reset
    title: Soft reset
    steps:
      - section: prepare
        text: Bring a False Swipe catcher, and save right in front of the Pokemon.
        source: https://bulbapedia.bulbagarden.net/wiki/Soft_resetting
      - section: loop
        text: >-
          Start the battle. If it is not shiny, close the game from the HOME Menu and reopen
          it; Switch games have no soft-reset button combination, and closing is the fastest
          reset.
        source: https://bulbapedia.bulbagarden.net/wiki/Soft_resetting
      - section: check
        text: >-
          A shiny plays a sparkle as it enters battle: stars fifteen times in sixteen for a
          static encounter, squares otherwise. In the overworld it shows its normal colours
          until the battle starts.
        source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon
      - section: after
        text: False Swipe it down to 1 HP, put it to sleep, then throw balls. Save as soon as it is caught.
        source: https://bulbapedia.bulbagarden.net/wiki/False_Swipe_(move)
      - section: mistake
        text: Saving after a battle that was not shiny, which removes the reset point.
        source: https://bulbapedia.bulbagarden.net/wiki/Soft_resetting

