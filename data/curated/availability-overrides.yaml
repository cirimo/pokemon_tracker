# Where upstream is wrong about which game offers a variant, with the source that says so.
#
# Upstream (pokepc/dataset 6.8.2) separates the versions of Let's Go, Brilliant Diamond and
# Shining Pearl, and Scarlet and Violet, but lists the same 830 variants for Sword and for
# Shield. So a Shield exclusive read as a Sword farm job. A row here clears `obtainable` for
# one game; it may only narrow upstream, never widen it (docs/dataset-pipeline.md).
#
#   version-exclusive   the other version of the pair has it; `exclusiveTo` names it, and
#                       this one gets it only by trade
#   online-only         labelled, not narrowed: this version reaches it only through another
#                       player's game online (a Crown Tundra legendary in their Max Lair), so
#                       `obtainable` stays and `exclusiveTo` says whose it is
#   trade-only          neither version can catch it; it arrives by trade or HOME
#
# Sword and Shield rows: Bulbapedia's version-exclusive tables for the base game, The Isle of
# Armor and The Crown Tundra, all forms of each listed species (Galarian forms only where the
# table says Galarian, and Red- or Blue-Striped Basculin as listed). Species the notes under
# those tables say both versions get some other way are not here: Ninetales, Hitmonlee,
# Arcanine and Hitmonchan (raids), both Indeedee and Meowstic (breeding, evolution), Sawk and
# Throh (an in-game trade in Circhester), and Escavalier, Accelgor, Passimian and Oranguru
# (both versions with the Expansion Pass). The version-exclusive Crown Tundra legendaries are
# online-only: Bulbapedia's note under that table says another player's Dynamax Adventure
# offers them, and that the path stays unlocked once met.

overrides:
  # --- Sword exclusives (not in Shield) ---
  - variantId: farfetchd-galar
    gameId: swsh-sh
    kind: version-exclusive
    exclusiveTo: swsh-sw
    reason: Sword exclusive (Sword and Shield); the other version gets it only by trade.
    source: https://bulbapedia.bulbagarden.net/wiki/Version-exclusive_Pok%C3%A9mon

