# Shiny odds: what changes them, per game and method.
#
# Every Switch game rolls 1/4096 per attempt, so the base is not repeated here. A row
# either adds rolls or replaces the rate outright:
#
#   rollsAdded    the game rolls for shiny N extra times. Three rolls in total is
#                 1 - (4095/4096)^3, about 1/1365.67 -- the figure Bulbapedia prints.
#   denominator   the method replaces the rate. Dynamax Adventures are a flat 1/300, which
#                 no amount of reroll arithmetic reproduces.
#
# How rows combine (the thing the first version of this file could not say):
#
#   no tier       rows stack: their rolls are summed.
#   tier: x       rows sharing a tier are levels of one thing, and only the best counts.
#                 Clearing 60 of an outbreak does not also count the 30 on the way there.
#   inherent      comes with the method itself, so it is in the method's plain odds.
#
# `games` and `methods` are lists: a row applies to every pair of them. Every row cites
# the table it was read from, and was checked against that table rather than remembered.

modifiers:
  # --- Scarlet / Violet -------------------------------------------------------
  # Rates table (Charm, Masuda) and Gen IX "Methods of increasing Shiny rates".
  - games: [sv-s, sv-v]
    id: shiny-charm
    label: Shiny Charm
    methods: [wild, mass-outbreak, breeding]
    rollsAdded: 2
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon
  - games: [sv-s, sv-v]
    id: outbreak-30
    label: Outbreak, 30 cleared
    methods: [mass-outbreak]
    tier: outbreak-cleared
    rollsAdded: 1
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon
  - games: [sv-s, sv-v]
    id: outbreak-60
    label: Outbreak, 60 cleared
    methods: [mass-outbreak]
    tier: outbreak-cleared
    rollsAdded: 2
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon
  - games: [sv-s, sv-v]
    id: sparkling-power-1
    label: Sparkling Power Lv. 1
    methods: [wild, mass-outbreak]
    tier: sparkling-power
    rollsAdded: 1
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon
  - games: [sv-s, sv-v]
    id: sparkling-power-2
    label: Sparkling Power Lv. 2
    methods: [wild, mass-outbreak]
    tier: sparkling-power
    rollsAdded: 2
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon
  - games: [sv-s, sv-v]
    id: sparkling-power-3
    label: Sparkling Power Lv. 3
    methods: [wild, mass-outbreak]
    tier: sparkling-power
    rollsAdded: 3
    notes: From a sandwich; the Sparkling Power type must match the target.
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon
  - games: [sv-s, sv-v]
    id: masuda
    label: Masuda method
    methods: [breeding]
    rollsAdded: 5
    notes: Parents from different-language games.
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon

