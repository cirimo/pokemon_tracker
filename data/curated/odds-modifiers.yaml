    rollsAdded: 6
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon
  - games: [swsh-sw, swsh-sh]
    id: masuda
    label: Masuda method
    methods: [breeding]
    rollsAdded: 5
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon
  - games: [swsh-sw, swsh-sh]
    id: dynamax-adventure
    label: Dynamax Adventure
    methods: [dynamax-adventure]
    denominator: 300
    inherent: true
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon
  - games: [swsh-sw, swsh-sh]
    id: dynamax-adventure-charm
    label: Shiny Charm
    methods: [dynamax-adventure]
    denominator: 100
    notes: Replaces the 1/300 rather than adding rolls to it.
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon

