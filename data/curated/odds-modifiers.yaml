  - games: [la]
    id: research-10
    label: Research level 10
    methods: [wild, mass-outbreak, massive-mass-outbreak]
    tier: research
    rollsAdded: 1
    notes: Per species.
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon
  - games: [la]
    id: research-perfect
    label: Research perfect
    methods: [wild, mass-outbreak, massive-mass-outbreak]
    tier: research
    rollsAdded: 3
    notes: Per species, once every research task for the entry is done.
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon
  - games: [la]
    id: shiny-charm
    label: Shiny Charm
    methods: [wild, mass-outbreak, massive-mass-outbreak]
    rollsAdded: 3
    notes: From Professor Laventon once every Pokedex entry is at research level 10.
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon
