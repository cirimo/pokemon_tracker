# How to catch things in Sword.
#
# Curated 2026-11-18 for the game being played (prompt 11). Drafted by
# tools/curation/draft_swsh.py and read through by hand. Sources:
#
#   Dynamax_Adventure      the special Pokemon at the end of a Dynamax Adventure, with the
#                          rules for keeping one, noting its path, and the 1/300 (1/100 with
#                          the charm) rate in odds-modifiers.yaml
#   List_of_in-game_event_Pokemon_in_Pokemon_Sword_and_Shield
#                          the Crown Tundra statics and whether each can be shiny
#   Version-exclusive_Pokemon
#                          which Crown Tundra legendaries are Shield's (online-only here; the
#                          override is in availability-overrides.yaml)
#
# Locked in Sword (shiny-locks.yaml): Zacian, Zamazenta, Eternatus, the Galarian birds,
# Keldeo, Type: Null, Silvally, Poipole, Naganadel. Not curated, on purpose: the Therian
# Formes of Tornadus, Thundurus and Landorus and Giratina's Origin Forme, because no source
# read places the item that changes them in Sword; and the random, untargetable Dynamax
# Adventure catches of ordinary species, which are a bonus per adventure rather than a way
# to hunt one. `npm run coverage -- swsh-sw --list` shows what is left.

gameId: swsh-sw

encounters:
  # --- Legendary Pokemon and Ultra Beasts ---------------------------------------
  - variantId: articuno
    methodId: dynamax-adventure
    location: Max Lair
    prerequisite: "The Crown Tundra: a Dynamax Adventure from the Max Lair on Slippery Slope."
    notes: Only one can ever be kept on a save file. Declining it at the end keeps it catchable, and the scientist notes its path for free (three notes at a time).
    source: https://bulbapedia.bulbagarden.net/wiki/Dynamax_Adventure

