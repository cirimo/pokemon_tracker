# How to catch things in Legends Arceus.
#
# Curated 2026-09-24, for the game being played. Drafted by tools/curation/draft_la.py from
# four Bulbapedia sources and then read through by hand:
#
#   Mass_outbreak           the Legends Arceus table of which Pokemon appear in mass and
#                           massive mass outbreaks, per area. The page's own rule is that an
#                           outbreak species also spawns in the overworld there, so each
#                           outbreak row has a wild row beside it.
#   Space-time_distortion   the common and rare spawns of each area's distortions.
#   <area> pages            where the wild rows' areas come from.
#   Shiny_Pokemon           gifts are never shiny; so the first partners' gift is locked.
#   pokepc/dataset          evolution conditions, for variants reached only by evolving.
#
# Forms are matched on Bulbapedia's menu-sprite codes (058H is Hisuian Growlithe, 201QU is
# Unown ?, 412G is Sandy Cloak Burmy), never on names.
#
# Not curated, on purpose, because no source above places them: the three Burmy cloaks and
# the Wormadam and Mothim that evolve from them (Burmy comes from shaking trees), Rotom's
# five appliance forms (changed, not caught), and Alolan Vulpix and Ninetales (a request
# reward). The app says "no method recorded yet" for them. Legendary and Mythical Pokemon
# are locked in shiny-locks.yaml. `npm run coverage -- la --list` shows what is left.
#
# Odds for mass outbreaks, massive mass outbreaks and wild spawns are in odds-modifiers.yaml.
# Distortions have none recorded: the rate tables do not cover them.

