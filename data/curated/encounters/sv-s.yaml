# How to catch things in Scarlet.
#
# One file per game so a hunting session touches one file, and so a game can be added
# without rewriting anything that exists. gameId is stated once at the top rather than
# repeated on every row.
#
# Seeded, not complete. Every row cites a source; a row that cannot is not a row.

gameId: sv-s

encounters:
  - variantId: koraidon
    methodId: static
    location: Area Zero
    shinyLocked: true
    notes: Story encounter. The game-wide lock is in shiny-locks.yaml.
    source: https://bulbapedia.bulbagarden.net/wiki/Shiny_Pok%C3%A9mon

  - variantId: dudunsparce-three-segment
    methodId: evolution
    from: dunsparce
    prerequisite: >-
      Level up Dunsparce knowing Hyper Drill. The three-segment form is a 1-in-100 roll at
      evolution and is independent of shininess, so hunt the shiny Dunsparce first.
    notes: >-
      Two independent rolls, and the form cannot be rerolled after evolving.
    source: https://bulbapedia.bulbagarden.net/wiki/Dudunsparce_(Pok%C3%A9mon)
