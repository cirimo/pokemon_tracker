name: record screenshots

# Golden images must be produced by the machine that verifies them.
#
# Roborazzi comparison is pixel-exact, and Robolectric's rendering is not byte-identical
# across operating systems. Goldens recorded on a Windows workstation therefore fail on
# ubuntu-latest even when nothing about the UI changed -- which is exactly what happened
# the first time the screenshot workflow ever ran (it only triggers on design-system/**,
# so it had never been exercised before M1 touched that module).
#
# So: record here, commit from here, verify here. Running
# `./gradlew :design-system:recordRoborazziDebug` locally is still useful for looking at
# what a component renders, but those images must NOT be committed -- see
# docs/design-usage.md.
#
# Trigger this by hand after a deliberate visual change, then pull. It is intentionally
# not automatic: a job that re-records goldens whenever verification fails would commit
# away every regression the gate exists to catch.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      # No lfs: the sprite set is only needed by :core:data's asset check. The
      # design-system tests draw their own placeholder sprite, so pointer files are fine
      # and skipping the LFS pull keeps this job quick.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # This also runs the tests, so a broken component fails here rather than silently
      # recording a picture of the breakage.
      - name: Record
        run: ./gradlew :design-system:recordRoborazziDebug --stacktrace

      # A consistency check on what we are about to commit, not an independent one --
      # verifying images against themselves cannot fail for interesting reasons. The real
      # verification is the next ordinary push.
      - name: Verify the recorded set
        run: ./gradlew :design-system:verifyRoborazziDebug --stacktrace

      - name: Commit
        run: |
          set -e
          if [ -z "$(git status --porcelain -- design-system/src/test/screenshots)" ]; then
            echo "Goldens already match this runner. Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-system/src/test/screenshots
          git status --short -- design-system/src/test/screenshots
          # Two -m flags rather than one multi-line string: a quoted newline here would
          # carry this file's YAML indentation into the commit body.
          git commit             -m "Record design-system screenshots on ubuntu-latest"             -m "Regenerated by .github/workflows/record-screenshots.yml, so the goldens and the runner that verifies them come from the same platform. See docs/design-usage.md."
          git push

      # A push made with GITHUB_TOKEN deliberately does not trigger other workflows, so
      # nothing re-verifies this commit on its own. Say so rather than leaving it to be
      # discovered.
      - name: Note
        if: success()
        run: echo "Pull, then push any further change -- that push is what re-runs verification."
