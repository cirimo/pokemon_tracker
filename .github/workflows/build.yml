name: build

# Every push, on every branch. This repo is worked solo on feature branches that
# are merged locally, so gating on pull_request would mean CI never ran.
# pull_request is deliberately absent: push already covers the branch a PR would
# be opened from, and having both runs the same commit twice.
on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The sprite set is in LFS. Without this the dataset asset check compares
          # against pointer files and passes for the wrong reason.
          lfs: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Static analysis
        run: ./gradlew detekt lintDebug --stacktrace

      # Contrast, type-colour ramps, 48dp touch targets, TalkBack sentences and container
      # contracts. The accessibility promises in docs/design-system.md are gated here
      # rather than trusted. This half runs anywhere, including on a workstation.
      - name: Design system
        run: ./gradlew :design-system:designCheck --stacktrace

      # Screenshots are a CI-only gate: Roborazzi compares pixels exactly and Robolectric
      # does not render identically across operating systems, so a golden is only valid on
      # the platform that recorded it. Goldens come from the record-screenshots workflow,
      # which runs on this same image.
      - name: Screenshots
        run: ./gradlew :design-system:verifyRoborazziDebug --stacktrace

      # The dependency rule from CLAUDE.md, enforced rather than trusted. A feature
      # module that reaches for another feature module fails here, not at review.
      - name: Module boundaries
        run: |
          set -e
          for module in feature/*/build.gradle.kts; do
            if grep -Eq 'project\(":feature:' "$module"; then
              echo "::error file=$module::a feature module depends on another feature module"
              exit 1
            fi
          done
          if grep -Eq 'project\(":(core|feature):' design-system/build.gradle.kts; then
            echo "::error::design-system must not depend on core or feature modules"
            exit 1
          fi
          # :baselineprofile drives :app from outside through targetProjectPath. It must
          # never take a project dependency, and only :app may reference it, so it can
          # never become a route from one feature to another.
          if grep -q 'project(' baselineprofile/build.gradle.kts; then
            echo "::error file=baselineprofile/build.gradle.kts::baselineprofile must not depend on a project"
            exit 1
          fi
          for module in $(git ls-files '*build.gradle.kts' | grep -v '^app/'); do
            if grep -q ':baselineprofile"' "$module"; then
              echo "::error file=$module::only :app may reference :baselineprofile"
              exit 1
            fi
          done

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
