name: dataset

# The pipeline is not part of the app build -- the asset is checked in. This workflow
# exists to answer one question: does regenerating it from the pinned inputs still
# produce what is committed?
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/dataset-pipeline/**'
      - 'data/curated/**'
      - 'core/data/src/main/kotlin/**/reference/**'
      - 'core/data/schemas/**'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      # The pipeline reads the schema Room exports, so the module has to compile first.
      - name: Export Room schemas
        run: ./gradlew :core:data:assembleDebug

      - name: Install pipeline
        working-directory: tools/dataset-pipeline
        run: npm ci

      - name: Pipeline tests
        working-directory: tools/dataset-pipeline
        run: npm test

      - name: Rebuild dataset
        working-directory: tools/dataset-pipeline
        run: npm run build:dataset

      # The reproducibility contract: same inputs, same content. There is deliberately no
      # byte-identity check on the .db: the SQLite this runner's Node links is not the one
      # a workstation's does, so the bytes differ while the content matches. See
      # docs/adr/0003-dataset-pipeline.md, "Amended 2026-09-23".
      - name: Content manifest is unchanged
        run: git diff --exit-code -- core/data/src/main/assets/dataset/dataset-manifest.json
