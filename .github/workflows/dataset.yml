name: dataset

# The pipeline is not part of the app build -- the asset is checked in. This workflow
# exists to answer one question: does regenerating it from the pinned inputs still
# produce what is committed?
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/dataset-pipeline/**'
      - 'data/curated/**'
      - 'core/data/src/main/kotlin/**/reference/**'
      - 'core/data/schemas/**'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      # The pipeline reads the schema Room exports, so the module has to compile first.
      - name: Export Room schemas
        run: ./gradlew :core:data:assembleDebug

      - name: Install pipeline
        working-directory: tools/dataset-pipeline
        run: npm ci

      - name: Pipeline tests
        working-directory: tools/dataset-pipeline
        run: npm test

      - name: Rebuild dataset
        working-directory: tools/dataset-pipeline
        run: npm run build:dataset

      # The real reproducibility contract: same inputs, same content.
      - name: Content manifest is unchanged
        run: git diff --exit-code -- core/data/src/main/assets/dataset/dataset-manifest.json

      # Stricter, and allowed to fail loudly when the SQLite version moves. If this
      # fails but the manifest check passed, the dataset is correct and the .db simply
      # needs recommitting.
      - name: Database is byte-identical
        run: git diff --exit-code -- core/data/src/main/assets/dataset/reference.db
